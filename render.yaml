services:
  - type: web
    name: volle
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: volle-data
      mountPath: /var/data
      sizeGB: 1
