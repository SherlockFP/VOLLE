services:
  - type: web
    name: volle
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR
        value: /var/data
      - key: COSMETIC_ENTITLEMENT_SECRET
        generateValue: true
    disk:
      name: volle-data
      mountPath: /var/data
      sizeGB: 1
